# Ergänzung zu docker-compose.yml für den Hetzner-Server (siehe .github/workflows/deploy.yml):
#   docker compose -f docker-compose.yml -f deploy/docker-compose.prod.yml up -d --build
services:
  api:
    environment:
      ANONYMIZER_MCP_ALLOWED_HOSTS: openanonymizer.tma-it-solution.de

  dashboard:
    # Image wird in GitHub Actions gebaut und per SSH geladen (docker load).
    image: anonymizer-dashboard:latest
    pull_policy: never
    depends_on: [api]
    environment:
      ANONYMIZER_API_URL: http://api:8080
      ANONYMIZER_PUBLIC_API_URL: https://openanonymizer.tma-it-solution.de
      ARCA_API_URL: http://arca:8100
      ARCA_TERMINAL_URL: /arca/terminal
    read_only: true
    tmpfs:
      - /tmp
      - /app/.next/cache:uid=1000,gid=1000
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    restart: unless-stopped

  # Arca-Prototyp: Service + Claude-Terminal (jede Person mit eigenem Claude-Abo, Login über das Dashboard).
  # Kein veröffentlichter Port. ARCA_SECRET steht in der .env auf dem Server (Deploy legt ihn an).
  arca:
    image: anonymizer-arca:latest
    pull_policy: never
    depends_on: [api]
    environment:
      ARCA_SECRET: ${ARCA_SECRET:?ARCA_SECRET fehlt in .env}
      ARCA_AUTH_API_URL: http://api:8080
      ARCA_SERVICE_URL: http://127.0.0.1:8100
      ARCA_ALLOWED_ORIGINS: https://openanonymizer.tma-it-solution.de
      # Docker erlaubt kein unshare --net: OCR läuft lokal im Container, aber ohne eigene Netztrennung.
      ARCA_OCR_ISOLATION: auto
    volumes:
      - arca-data:/data/arca
      - arca-claude:/data/claude
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    restart: unless-stopped

  caddy:
    image: caddy:2.8-alpine
    depends_on: [api, dashboard, arca]
    command: ["caddy", "run", "--config", "/etc/caddy-conf/Caddyfile", "--adapter", "caddyfile"]
    environment:
      ANONYMIZER_DOMAIN: openanonymizer.tma-it-solution.de
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      # Verzeichnis statt Einzeldatei: rsync ersetzt Dateien, ein Einzeldatei-Mount sähe die alte Version.
      # Pfade relativ zum Projektverzeichnis (Repo-Root).
      - ./deploy:/etc/caddy-conf:ro
      - caddy-data:/data
      - caddy-config:/config
    restart: unless-stopped

volumes:
  arca-data:
  arca-claude:
  caddy-data:
  caddy-config:
