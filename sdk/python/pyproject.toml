[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "anonymizer-sdk"
version = "0.1.0"
description = "Python client for the Anonymizer privacy API (detect, classify, anonymize, protect legal data)."
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.10"
dependencies = ["httpx>=0.27"]

[project.optional-dependencies]
openai = ["openai>=1.0"]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]
