[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "arca"
version = "0.1.0"
description = "Arca: duale Datenbank. Claude liest nur freigegebene, anonymisierte Daten."
license = { text = "Apache-2.0" }
requires-python = ">=3.11"
# anonymizer-core (packages/core) muss installiert sein: pip install -e packages/core
dependencies = ["fastapi>=0.110", "uvicorn>=0.29", "mcp>=2.0"]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]

[project.scripts]
arca-service = "arca.service:run"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
