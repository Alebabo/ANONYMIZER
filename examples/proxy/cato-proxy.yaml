# Cato MCP proxy: demo configuration with a synthetic customer database.
# Relative paths are resolved against this file.
destination: external
policy: support-default

# Write traces and audit entries where the API reads them, so calls show up in the dashboard.
# With docker compose, point these at the mounted data volume instead (see docs/proxy.md).
trace_db: ../../packages/core/data/traces.db
audit_db: ../../packages/core/data/audit.db

upstreams:
  demo:
    command: ["python", "demo_db_server.py"]
    cwd: .
    mode: enforce            # enforce | observe (observe returns raw data: test data only)
    # tools: { allow: ["get_customers", "get_tickets"] }
    # field_hints: { name: person }
