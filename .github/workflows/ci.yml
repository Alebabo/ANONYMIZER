name: CI

# Nur main und Pull Requests; Arbeitsbranches (claude/**, feature/**) lösen keine Läufe
# und keine Fehler-Mails aus. Manuell startbar über "Run workflow".
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true  # German NER model Cato (packages/core/models/cato-1.1)
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: packages/core/pyproject.toml
      - name: Install
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq tesseract-ocr tesseract-ocr-deu
          pip install -e "packages/core[dev,ocr]" -e "sdk/python[dev]" -e "arca[dev]"
          python -m spacy download en_core_web_lg
      - name: Test core
        working-directory: packages/core
        run: pytest -q
      - name: Test SDK
        working-directory: sdk/python
        run: pytest -q
      - name: Test Arca
        working-directory: arca
        run: pytest -q
      - name: Corpus evaluation
        working-directory: packages/core
        run: anonymizer eval tests/corpus

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit
      - name: Test Arca-Terminal
        run: npm --prefix arca/terminal ci && npm --prefix arca/terminal test
      - run: npx next build
