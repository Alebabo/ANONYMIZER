name: CI

on:
  push:
    branches: [main, "claude/**"]
  pull_request:

permissions:
  contents: read

jobs:
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: packages/core/pyproject.toml
      - name: Install
        run: |
          pip install -e "packages/core[dev]" -e "sdk/python[dev]" openai
          python -m spacy download de_core_news_lg
          python -m spacy download en_core_web_lg
      - name: Test core
        working-directory: packages/core
        run: pytest -q
      - name: Test SDK
        working-directory: sdk/python
        run: pytest -q
      - name: Corpus evaluation
        working-directory: packages/core
        run: anonymizer eval tests/corpus

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npx next build
