name: Deploy

# Deployt die API (docker-compose.yml) auf den Hetzner-Server, sobald die CI
# auf main grün ist. Manuell startbar über "Run workflow".
#
# Benötigte Repository-Secrets:
#   DEPLOY_HOST     optional, Standard: 178.105.31.110
#   DEPLOY_SSH_KEY  privater SSH-Schlüssel (öffentlicher Teil in authorized_keys des Servers)
#   ADMIN_EMAIL, ADMIN_PASSWORD  optional: erster Dashboard-Admin (nur solange noch kein Nutzer existiert)
# Optional (Repository-Variablen):
#   DEPLOY_USER     Standard: root
#   DEPLOY_PATH     Standard: /opt/anonymizer
#
# Beim ersten Lauf installiert der Job Docker (falls fehlend) und legt eine .env
# mit zufälligen Schlüsseln an. Die .env bleibt ausschließlich auf dem Server und
# wird nie überschrieben. ANONYMIZER_VAULT_KEY daraus extern sichern.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    if: github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    env:
      HOST: ${{ secrets.DEPLOY_HOST || '178.105.31.110' }}
      USER: ${{ vars.DEPLOY_USER || 'root' }}
      DEST: ${{ vars.DEPLOY_PATH || '/opt/anonymizer' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: SSH einrichten
        env:
          KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          test -n "$HOST" || { echo "Secret DEPLOY_HOST fehlt"; exit 1; }
          test -n "$KEY" || { echo "Secret DEPLOY_SSH_KEY fehlt"; exit 1; }
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          # Schlüssel normalisieren: beim Kopieren (z. B. am Handy) gehen oft
          # Zeilenumbrüche verloren oder es kommen \r bzw. Leerzeichen hinzu.
          python3 - > ~/.ssh/id_ed25519 <<'PY'
          import base64, os, re, sys, textwrap
          k = os.environ["KEY"]
          # Toleriert fehlende Umbrüche, \r, Leerzeichen und iOS-"Smart Punctuation"
          # (aus "-----" werden Gedankenstriche). Fehlen BEGIN/END, gilt alles als Inhalt.
          m = re.search(r"BEGIN\s*OPENSSH\s*PRIVATE\s*KEY(.*?)END\s*OPENSSH\s*PRIVATE\s*KEY", k, re.S)
          body = m.group(1) if m else k
          body = re.sub(r"[^A-Za-z0-9+/=]", "", body)
          print(f"Markierungen gefunden: {bool(m)}, Länge Inhalt: {len(body)}", file=sys.stderr)
          try:
              ok = base64.b64decode(body + "=" * (-len(body) % 4)).startswith(b"openssh-key-v1\0")
          except Exception:
              ok = False
          if not ok:
              raise SystemExit("DEPLOY_SSH_KEY ist kein gültiger OpenSSH-Schlüssel (unvollständig kopiert?)")
          print("-----BEGIN OPENSSH PRIVATE KEY-----")
          print("\n".join(textwrap.wrap(body, 70)))
          print("-----END OPENSSH PRIVATE KEY-----")
          PY
          chmod 600 ~/.ssh/id_ed25519
          echo "Fingerprint des Deploy-Keys:"; ssh-keygen -lf ~/.ssh/id_ed25519
          ssh-keyscan -T 15 -t ed25519 "$HOST" >> ~/.ssh/known_hosts

      - name: Server vorbereiten (Docker, Verzeichnis)
        run: |
          ssh "$USER@$HOST" "DEST='$DEST' bash -s" <<'EOF'
          set -euo pipefail
          SUDO=""; [ "$(id -u)" -eq 0 ] || SUDO="sudo"
          if ! command -v docker >/dev/null; then
            curl -fsSL https://get.docker.com | $SUDO sh
          fi
          # Swap als Puffer für kleine Server (spaCy-Modelle + Docker-Build)
          if [ "$(swapon --show --noheadings | wc -l)" -eq 0 ]; then
            $SUDO fallocate -l 2G /swapfile && $SUDO chmod 600 /swapfile
            $SUDO mkswap /swapfile >/dev/null && $SUDO swapon /swapfile
            grep -q '^/swapfile' /etc/fstab || echo '/swapfile none swap sw 0 0' | $SUDO tee -a /etc/fstab >/dev/null
          fi
          if ! command -v rsync >/dev/null; then
            $SUDO apt-get update -qq && $SUDO apt-get install -y -qq rsync
          fi
          $SUDO mkdir -p "$DEST"
          $SUDO chown "$(id -u):$(id -g)" "$DEST"
          EOF

      - name: Code übertragen
        run: |
          rsync -az --delete \
            --exclude '.env' --exclude '__pycache__' --exclude '.pytest_cache' \
            --include 'docker-compose.yml' \
            --include 'packages/' --include 'packages/core/***' \
            --include 'examples/***' \
            --include 'deploy/***' \
            --exclude '*' \
            ./ "$USER@$HOST:$DEST/"

      - name: Dashboard-Image bauen und übertragen
        run: |
          docker build -f deploy/dashboard.Dockerfile -t anonymizer-dashboard:latest .
          docker save anonymizer-dashboard:latest | gzip | ssh "$USER@$HOST" 'gunzip | docker load'

      - name: .env beim ersten Mal anlegen
        run: |
          ssh "$USER@$HOST" "DEST='$DEST' bash -s" <<'EOF'
          set -euo pipefail
          cd "$DEST"
          if [ ! -f .env ]; then
            umask 077
            {
              echo "ANONYMIZER_API_KEYS=anonymizer_$(openssl rand -hex 24)"
              echo "ANONYMIZER_ADMIN_KEYS=anonymizer_$(openssl rand -hex 24)"
              echo "ANONYMIZER_VAULT_KEY=$(openssl rand -base64 32)"
            } > .env
            echo ".env neu angelegt"
          fi
          EOF

      - name: Ersten Dashboard-Admin eintragen (nur falls noch nicht vorhanden)
        env:
          ADMIN_EMAIL: ${{ secrets.ADMIN_EMAIL }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
        run: |
          if [ -z "$ADMIN_EMAIL" ] || [ -z "$ADMIN_PASSWORD" ]; then
            echo "Secrets ADMIN_EMAIL/ADMIN_PASSWORD nicht gesetzt, übersprungen"; exit 0
          fi
          printf 'ANONYMIZER_BOOTSTRAP_ADMIN_EMAIL=%s\nANONYMIZER_BOOTSTRAP_ADMIN_PASSWORD=%s\n' "$ADMIN_EMAIL" "$ADMIN_PASSWORD" \
            | ssh "$USER@$HOST" "cd '$DEST' && if grep -q '^ANONYMIZER_BOOTSTRAP_ADMIN_EMAIL=' .env; then cat >/dev/null; echo 'bereits vorhanden'; else cat >> .env; echo 'eingetragen'; fi"

      - name: Container bauen und starten
        run: |
          ssh "$USER@$HOST" "DEST='$DEST' bash -s" <<'EOF'
          set -euo pipefail
          cd "$DEST"
          export COMPOSE_FILE=docker-compose.yml:deploy/docker-compose.prod.yml
          docker compose up -d --build --remove-orphans
          # Geänderte Caddyfile übernehmen (Container wird bei reinen Dateiänderungen nicht neu erstellt)
          # </dev/null: sonst liest exec den Rest dieses per stdin übergebenen Skripts
          docker compose exec -T caddy caddy reload --config /etc/caddy-conf/Caddyfile --adapter caddyfile </dev/null || docker compose restart caddy
          docker image prune -f >/dev/null
          ok=""
          for i in $(seq 1 40); do
            if curl -fsS http://127.0.0.1:8080/health >/dev/null; then ok=1; break; fi
            sleep 5
          done
          [ -n "$ok" ] || { echo "API-Health-Check fehlgeschlagen"; docker compose logs --tail 100 api; exit 1; }
          echo "API ok"
          DOMAIN=openanonymizer.tma-it-solution.de
          for i in $(seq 1 24); do
            code=$(curl -ks -o /dev/null -w '%{http_code}' --resolve "$DOMAIN:443:127.0.0.1" "https://$DOMAIN/login" || true)
            if [ "$code" = "200" ]; then echo "Dashboard ok"; docker compose ps; exit 0; fi
            sleep 5
          done
          echo "Dashboard-Check fehlgeschlagen (HTTP $code)"; docker compose logs --tail 60 dashboard caddy; exit 1
          EOF
