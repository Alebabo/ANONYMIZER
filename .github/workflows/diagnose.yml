name: Diagnose

# Manuell: prüft den Server (Container, Admin-Account, Login). Gibt keine
# Schlüssel oder Passwörter aus, nur Variablennamen, Anzahlen und HTTP-Codes.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    env:
      HOST: ${{ secrets.DEPLOY_HOST || '178.105.31.110' }}
      USER: ${{ vars.DEPLOY_USER || 'root' }}
      DEST: ${{ vars.DEPLOY_PATH || '/opt/anonymizer' }}
    steps:
      - name: SSH einrichten
        env:
          KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          python3 - > ~/.ssh/id_ed25519 <<'PY'
          import os, re, textwrap
          k = os.environ["KEY"]
          m = re.search(r"BEGIN\s*OPENSSH\s*PRIVATE\s*KEY(.*?)END\s*OPENSSH\s*PRIVATE\s*KEY", k, re.S)
          body = re.sub(r"[^A-Za-z0-9+/=]", "", m.group(1) if m else k)
          print("-----BEGIN OPENSSH PRIVATE KEY-----")
          print("\n".join(textwrap.wrap(body, 70)))
          print("-----END OPENSSH PRIVATE KEY-----")
          PY
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -T 15 -t ed25519 "$HOST" >> ~/.ssh/known_hosts

      - name: Server-Zustand
        run: |
          ssh "$USER@$HOST" "DEST='$DEST' bash -s" <<'EOF'
          cd "$DEST"
          export COMPOSE_FILE=docker-compose.yml:deploy/docker-compose.prod.yml
          echo "== Variablen in .env (nur Namen)"; cut -d= -f1 .env
          echo "== Container"; docker compose ps --format '{{.Service}} {{.Status}}'
          echo "== Speicher"; free -m | head -3
          echo "== Nutzer in der Datenbank"
          docker compose exec -T api python -c "
          import sqlite3
          db = sqlite3.connect('/data/accounts.db')
          print('Anzahl:', db.execute('select count(*) from users').fetchone()[0])
          for email, role in db.execute('select email, role from users'):
              print('Domain:', email.split('@')[-1], 'Länge:', len(email), 'Rolle:', role)
          " </dev/null || true
          echo "== API-Log (bootstrap/login/error)"; docker compose logs api 2>&1 | grep -iE 'bootstrap|login|error|Traceback' | tail -20
          echo "== Dashboard-Log"; docker compose logs --tail 30 dashboard 2>&1
          # Arca: Zugriffslog (Pfade, Statuscodes) und Fehler. Inhalte (Fragen, Mandatsdaten) loggt Arca nicht.
          echo "== Arca-Log"; docker compose logs --tail 80 arca 2>&1 | grep -vE 'GET /status' | tail -60
          echo "== Arca: Claude-Version und Login-Verzeichnisse (Anzahl)"
          docker compose exec -T arca sh -c 'claude --version; ls /data/claude 2>/dev/null | wc -l' </dev/null || true
          EOF

      - name: Login mit den Secrets testen
        env:
          ADMIN_EMAIL: ${{ secrets.ADMIN_EMAIL }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
        run: |
          echo "ADMIN_EMAIL: Länge ${#ADMIN_EMAIL}; ADMIN_PASSWORD: Länge ${#ADMIN_PASSWORD}"
          python3 -c 'import json,os;print(json.dumps({"email":os.environ["ADMIN_EMAIL"],"password":os.environ["ADMIN_PASSWORD"]}))' \
            | ssh "$USER@$HOST" "curl -s -o /dev/null -w 'API-Login: HTTP %{http_code}\n' -H 'Content-Type: application/json' --data @- http://127.0.0.1:8080/v1/auth/login"
