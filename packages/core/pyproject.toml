[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cato-core"
version = "0.1.0"
description = "Privacy engine for legal AI: detection, classification, anonymization and policy enforcement."
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.6",
  "PyYAML>=6.0",
]

[project.optional-dependencies]
ner = ["spacy>=3.7"]
dev = ["pytest>=8"]

[project.scripts]
cato = "cato.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
