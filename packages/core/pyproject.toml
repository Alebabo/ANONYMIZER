[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "anonymizer-core"
version = "0.1.0"
description = "Privacy engine for legal AI: detection, classification, anonymization and policy enforcement."
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.6",
  "PyYAML>=6.0",
  "spacy>=3.7",
  "cryptography>=42",
  "fastapi>=0.110",
  "uvicorn>=0.29",
  "mcp>=2.0",
  "pypdf>=4",
  "python-docx>=1.1",
  "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]
# Optional second NER detector (off by default, see docs/research/gliner-results.md). Pulls in PyTorch;
# for CPU-only: pip install torch --index-url https://download.pytorch.org/whl/cpu first.
gliner = ["gliner>=0.2.16"]
# Optional second NER detector newmean-pii (off by default, see docs/research/newmean-pii.md). No further
# dependencies; model files (2.6-15.5 MB) are downloaded from Hugging Face on first use.
newmean = ["newmean-pii>=1.6.1,<2"]

[project.scripts]
anonymizer = "anonymizer.cli:main"
anonymizer-api = "anonymizer.api:run"
anonymizer-mcp = "anonymizer.mcp:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.package-data]
"anonymizer.policy" = ["builtin/*.yaml"]
"anonymizer.detect" = ["data/*.txt"]
