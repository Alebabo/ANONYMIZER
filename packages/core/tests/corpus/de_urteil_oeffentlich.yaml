id: de_urteil_oeffentlich
language: de
text: |
  Der Bundesgerichtshof hat mit Urteil vom 12.05.2021 – VI ZR 12/20 – entschieden, dass ein Anspruch
  aus § 823 Abs. 1 BGB i. V. m. Art. 2 Abs. 1 GG bestehen kann. Das OLG Hamm hatte die Berufung
  zuvor zurückgewiesen. Die Entscheidung ist in der Fachliteratur auf Zustimmung gestoßen.
