id: de_arbeitsrecht
language: de
text: |
  Kündigungsschutzklage

  des Herrn Jonas Beispielmann, Am Rosengarten 7a, 50667 Köln,
  – Kläger –

  gegen

  die Rheinwerk Systeme GmbH & Co. KG, vertreten durch den Geschäftsführer Herrn Paul Fiktiv,
  – Beklagte –

  Der Kläger ist seit dem 1. April 2015 bei der Beklagten beschäftigt. Sein Bruttogehalt beträgt
  monatlich 5.200 EUR. Sozialversicherungsnummer: 12 150385 M 012. Der Kläger ist schwerbehindert
  mit einem Grad der Behinderung von 50 und Gewerkschaftsmitglied.

  Die Kündigung vom 30.06.2024 verstößt gegen § 1 Abs. 2 KSchG und § 168 SGB IX.
  Zuständig ist das Arbeitsgericht Köln. E-Mail: j.beispielmann@mail.example
expected_signals: [employment, litigation]
