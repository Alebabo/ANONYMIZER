id: en_litigation
language: en
text: |
  The plaintiff, Laura Kingsley, alleges that the defendant terminated her employment after she was
  diagnosed with cancer and took sick leave. Defendant counsel Mark Avery argues that Kingsley has a
  criminal record. Kingsley denies any prior conviction.

  Robert Hale, a former colleague, will testify as a witness.
expected_signals: [litigation, employment]
expected:
  - {type: person, text: Laura Kingsley, role: plaintiff}
  - {type: person, text: Kingsley, role: plaintiff}
  - {type: health_data, text: diagnosed}
  - {type: health_data, text: cancer}
  - {type: health_data, text: sick leave}
  - {type: person, text: Mark Avery, role: counsel}
  - {type: criminal_record, text: criminal record}
  - {type: criminal_record, text: prior conviction}
known_false_negatives:
  - {type: person, text: Robert Hale, note: "Name without honorific or preceding role; requires spaCy NER (cato-core[ner])."}
