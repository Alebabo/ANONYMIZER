# False-positive traps: strings that look like sensitive data but are not.
id: traps
language: de
text: |
  Version 2.10.3 wurde am Montag veröffentlicht. Die Seiten 12 bis 15 wurden aktualisiert.
  Bestellnummer 98765432109, Artikel 4711. Testkennung DE00 1234 5678 9012 3456 78 im Datensatz.
  Herr Ober, bitte zahlen! Die Kosten betragen 10000 Euro. Im Jahr 2024 stiegen die Preise um 3,5 %.
  Die Firma ist vertraulich mit dem Thema umgegangen.
expected:
  - {type: money, text: 10000 Euro}
  - {type: business_secret_marker, text: vertraulich}
must_not_detect:
  - {type: iban}
  - {type: tax_id}
  - {type: date}
  - {type: phone}
  - {type: credit_card}
known_false_positives:
  - {type: person, text: Ober, note: "Honorific + capitalised noun ('Herr Ober') is indistinguishable from a surname without NER."}
