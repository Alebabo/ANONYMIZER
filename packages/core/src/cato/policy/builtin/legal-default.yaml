# Cato default policy for legal work with external LLM providers.
# Conservative starting point; copy, adapt and version it for your firm.
name: legal-default
version: 1
description: Pseudonymize parties, redact identifiers, keep special categories and privileged material local.

rules:
  # Parties and contact data: pseudonymize so the model keeps the structure.
  - id: parties
    entity: [person, organization, location]
    action: pseudonymize
  - id: contact
    entity: [email, phone, address]
    action: pseudonymize
  - id: case_numbers
    entity: case_number
    action: pseudonymize

  # Identifiers: no analytical value for an LLM.
  - id: identifiers
    entity: [iban, credit_card, bic, tax_id, tax_number, social_security_number, vat_id]
    action: redact
  - id: date_of_birth
    entity: date_of_birth
    action: generalize

  # Special categories (Art. 9/10 GDPR) must never go to an external model.
  - id: special_categories_external
    category: special_category
    destinations: [external]
    action: local_only
    priority: 10
  - id: special_categories_local
    category: special_category
    destinations: [local]
    action: allow

  # Public references and markers stay readable.
  - id: public_references
    entity: [court, legal_citation, date, money]
    action: allow
  - id: confidentiality_markers
    entity: [privilege_marker, business_secret_marker]
    action: allow

document_rules:
  # Privileged documents in criminal matters need a human decision before
  # anything is sent to an external provider.
  - id: criminal_privileged_review
    description: Critical document in a criminal matter
    min_risk: critical
    signals: [criminal_proceeding]
    destinations: [external]
    action: review

default_action: redact
critical_floor: true
critical_floor_action: pseudonymize
review_uncertain: true
